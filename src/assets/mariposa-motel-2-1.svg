<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 540" width="1260" height="540" role="img" aria-labelledby="mariposa-motel-title mariposa-motel-description" style="background-color: #fbfaf8; border: 1px solid #dcd9d0; display: block;">
    <title id="mariposa-motel-title">Mariposa Motel</title>
    <desc id="mariposa-motel-description">Ilustração panorâmica em preto e tons de papel: um motel térreo com varanda e cadeiras vazias, o grande letreiro Mariposa Motel à direita e campos ao fundo.</desc>
    <defs>
      <!-- Textura de telhas para o telhado do motel -->
      <pattern id="shingles-b" width="12" height="7" patternUnits="userSpaceOnUse">
        <path d="M 0 7 L 12 7 M 6 0 L 6 7" stroke="#141414" stroke-width="0.55" opacity="0.35" fill="none" />
      </pattern>
      <!-- Hachura cruzada clássica para a volumetria 3D do letreiro -->
      <pattern id="crosshatch-dark" width="5" height="5" patternTransform="rotate(35 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="5" stroke="#141414" stroke-width="1.3" opacity="0.82" />
        <line x1="0" y1="0" x2="5" y2="0" stroke="#141414" stroke-width="0.6" opacity="0.4" />
      </pattern>
      <!-- Hachura leve para sombras arquitetónicas -->
      <pattern id="hatch-soft" width="5" height="5" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="5" stroke="#141414" stroke-width="0.7" opacity="0.3" />
      </pattern>
    </defs>

    <!-- Céu limpo (Espaço negativo #fbfaf8) -->
    <rect width="1260" height="540" fill="#fbfaf8" />

    <!-- Cabos elétricos finos à direita -->
    <path d="M 960 112 Q 1110 138 1260 132" stroke="#141414" stroke-width="0.7" fill="none" opacity="0.7" />
    <path d="M 1110 160 Q 1185 172 1260 168" stroke="#141414" stroke-width="0.7" fill="none" opacity="0.7" />

    <!-- Horizonte baixo e campo lavrado à direita -->
    <path d="M 700 258 L 1260 258" stroke="#141414" stroke-width="1.1" fill="none" />
    <!-- Pequena árvore solitária no horizonte à direita -->
    <path d="M 1218 258 C 1215 244, 1232 242, 1235 258 M 1226 258 L 1226 248" stroke="#141414" stroke-width="0.9" fill="none" />

    <!-- Sulcos da terra lavrada -->
    <rect x="700" y="258" width="560" height="152" fill="url(#hatch-soft)" />
    <g stroke="#141414" stroke-width="0.75" opacity="0.55">
      <line x1="705" y1="272" x2="1260" y2="268" />
      <line x1="705" y1="288" x2="1260" y2="282" />
      <line x1="705" y1="306" x2="1260" y2="298" />
      <line x1="705" y1="326" x2="1260" y2="316" />
      <line x1="705" y1="348" x2="1260" y2="338" />
      <line x1="705" y1="374" x2="1260" y2="362" />
      <line x1="705" y1="402" x2="1260" y2="390" />
    </g>

    <!-- Relvado ralo sob o letreiro à direita -->
    <path d="M 700 410 L 1260 398 L 1260 465 L 700 455 Z" fill="#f0eee9" stroke="#141414" stroke-width="0.9" />

    <!-- EDIFÍCIO DO MOTEL (Esquerda) -->
    <!-- Telhado principal -->
    <polygon points="0,202 685,202 708,284 0,284" fill="url(#shingles-b)" stroke="#141414" stroke-width="1.8" />
    <!-- Telhado do alpendre -->
    <polygon points="0,270 554,270 572,294 0,294" fill="#e4e1d8" stroke="#141414" stroke-width="1.8" />
    <!-- Sombra sob a aba do alpendre -->
    <rect x="0" y="294" width="554" height="8" fill="#141414" />

    <!-- Corpo da parede de tábuas brancas -->
    <rect x="0" y="284" width="704" height="172" fill="#fbfaf8" stroke="#141414" stroke-width="1.8" />
    <!-- Sombra projetada pelo telhado na parte direita da parede -->
    <rect x="554" y="284" width="150" height="14" fill="url(#hatch-soft)" />

    <!-- Tábuas horizontais (Clapboard) -->
    <g stroke="#141414" stroke-width="0.55" opacity="0.45">
      <line x1="0" y1="312" x2="704" y2="312" />
      <line x1="0" y1="328" x2="704" y2="328" />
      <line x1="0" y1="344" x2="704" y2="344" />
      <line x1="0" y1="360" x2="704" y2="360" />
      <line x1="0" y1="376" x2="704" y2="376" />
      <line x1="0" y1="392" x2="704" y2="392" />
      <line x1="0" y1="408" x2="704" y2="408" />
      <line x1="0" y1="424" x2="704" y2="424" />
      <line x1="0" y1="440" x2="704" y2="440" />
    </g>

    <!-- Porta 1 (Esquerda) -->
    <rect x="26" y="306" width="80" height="134" fill="#dcd9d0" stroke="#141414" stroke-width="4.5" />
    <rect x="34" y="314" width="64" height="62" fill="url(#hatch-soft)" stroke="#141414" stroke-width="1.2" />
    <line x1="26" y1="382" x2="106" y2="382" stroke="#141414" stroke-width="2.2" />
    <line x1="26" y1="410" x2="106" y2="410" stroke="#141414" stroke-width="2.2" />

    <!-- Janela 1 (Com aparelho de ar condicionado na base) -->
    <rect x="170" y="308" width="76" height="94" fill="#141414" stroke="#141414" stroke-width="3" />
    <rect x="176" y="314" width="64" height="82" fill="none" stroke="#fbfaf8" stroke-width="1.2" />
    <line x1="208" y1="314" x2="208" y2="366" stroke="#fbfaf8" stroke-width="1.2" />
    <line x1="176" y1="342" x2="240" y2="342" stroke="#fbfaf8" stroke-width="1.2" />
    <!-- Grelha do A/C na metade inferior da janela -->
    <rect x="180" y="366" width="56" height="28" fill="#dcd9d0" stroke="#141414" stroke-width="1.5" />

    <!-- Porta 2 (Centro) -->
    <rect x="300" y="306" width="76" height="134" fill="#dcd9d0" stroke="#141414" stroke-width="4.5" />
    <rect x="308" y="314" width="60" height="62" fill="url(#hatch-soft)" stroke="#141414" stroke-width="1.2" />
    <line x1="300" y1="382" x2="376" y2="382" stroke="#141414" stroke-width="2.2" />
    <line x1="300" y1="410" x2="376" y2="410" stroke="#141414" stroke-width="2.2" />

    <!-- Porta 3 (Direita do alpendre) -->
    <rect x="428" y="306" width="74" height="134" fill="#dcd9d0" stroke="#141414" stroke-width="4.5" />
    <rect x="436" y="314" width="58" height="62" fill="url(#hatch-soft)" stroke="#141414" stroke-width="1.2" />
    <line x1="428" y1="382" x2="502" y2="382" stroke="#141414" stroke-width="2.2" />
    <line x1="428" y1="410" x2="502" y2="410" stroke="#141414" stroke-width="2.2" />

    <!-- Janela 2 (Fora do alpendre, à direita) -->
    <rect x="552" y="308" width="68" height="94" fill="#141414" stroke="#141414" stroke-width="3" />
    <rect x="558" y="314" width="56" height="82" fill="none" stroke="#fbfaf8" stroke-width="1.2" />
    <line x1="586" y1="314" x2="586" y2="396" stroke="#fbfaf8" stroke-width="1.2" />
    <line x1="558" y1="355" x2="614" y2="355" stroke="#fbfaf8" stroke-width="1.5" />

    <!-- Pequenas luzes de parede junto às portas -->
    <circle cx="138" cy="320" r="3.5" fill="#141414" />
    <circle cx="272" cy="320" r="3.5" fill="#141414" />
    <circle cx="400" cy="320" r="3.5" fill="#141414" />

    <!-- Cadeiras vazias na varanda -->
    <!-- Cadeira 1 (Dobrável escura à esquerda) -->
    <path d="M 120 440 L 125 390 C 125 382, 158 382, 158 390 L 162 440 M 123 414 L 160 414" stroke="#141414" stroke-width="2.2" fill="none" />
    <path d="M 125 390 C 125 382, 158 382, 158 390 L 158 400 L 125 400 Z" fill="#141414" />
    <!-- Cadeira 2 (Poltrona baixa entre as portas 2 e 3) -->
    <rect x="390" y="388" width="38" height="26" rx="2" fill="#141414" />
    <path d="M 392 414 L 390 440 M 426 414 L 428 440 M 390 426 L 428 426" stroke="#141414" stroke-width="1.8" />

    <!-- As 4 colunas finas brancas do alpendre -->
    <g fill="#fbfaf8" stroke="#141414" stroke-width="1.8">
      <rect x="2" y="294" width="7" height="148" />
      <rect x="212" y="294" width="7" height="148" />
      <rect x="330" y="294" width="7" height="148" />
      <rect x="542" y="294" width="7" height="148" />
    </g>

    <!-- Base do alpendre e degraus centrais -->
    <rect x="0" y="440" width="552" height="32" fill="#dcd9d0" stroke="#141414" stroke-width="1.8" />
    <rect x="216" y="448" width="118" height="28" fill="#141414" />
    <line x1="216" y1="456" x2="334" y2="456" stroke="#fbfaf8" stroke-width="1.6" />
    <line x1="216" y1="466" x2="334" y2="466" stroke="#fbfaf8" stroke-width="1.6" />

    <!-- Caixote do lixo metálico na esquina direita do motel -->
    <rect x="696" y="430" width="30" height="42" rx="2" fill="#dcd9d0" stroke="#141414" stroke-width="1.8" />
    <ellipse cx="711" cy="430" rx="16" ry="3.5" fill="#fbfaf8" stroke="#141414" stroke-width="1.6" />
    <line x1="704" y1="436" x2="704" y2="468" stroke="#141414" stroke-width="0.9" />
    <line x1="718" y1="436" x2="718" y2="468" stroke="#141414" stroke-width="0.9" />

    <!-- Bebedouro de pássaros e os dois pequenos patos brancos à direita -->
    <g id="birdbath">
      <ellipse cx="1178" cy="418" rx="18" ry="3.5" fill="#fbfaf8" stroke="#141414" stroke-width="1.4" />
      <path d="M 1175 421 L 1173 458 L 1183 458 L 1181 421 Z" fill="#fbfaf8" stroke="#141414" stroke-width="1.3" />
      <ellipse cx="1178" cy="458" rx="11" ry="2.5" fill="#fbfaf8" stroke="#141414" stroke-width="1.3" />
      <!-- Dois pequenos patos de jardim -->
      <path d="M 1156 458 C 1156 452, 1164 452, 1166 456 L 1169 448 L 1172 449 L 1168 459 Z" fill="#fbfaf8" stroke="#141414" stroke-width="1.2" />
      <path d="M 1195 460 C 1195 454, 1205 454, 1207 458 L 1211 449 L 1215 450 L 1209 461 Z" fill="#fbfaf8" stroke="#141414" stroke-width="1.2" />
    </g>

    <!-- Pátio de cascalho claro em primeiro plano -->
    <path d="M 0 472 L 920 462 L 1260 478 L 1260 540 L 0 540 Z" fill="#fbfaf8" stroke="#141414" stroke-width="1.4" />
    <!-- Sombra horizontal na base do alpendre -->
    <rect x="10" y="470" width="185" height="8" fill="#141414" />
    <rect x="370" y="468" width="175" height="8" fill="#141414" />
    <!-- Textura subtil de cascalho -->
    <path d="M 45 502 L 165 498 M 280 515 L 460 510 M 590 492 L 770 490 M 140 526 L 240 525" stroke="#141414" stroke-width="0.8" stroke-dasharray="2 7" opacity="0.65" />

    <!-- GRANDE LETREIRO «MARIPOSA MOTEL» (Primeiro plano à direita) -->
    <!-- Poste vertical de aço -->
    <rect x="918" y="412" width="38" height="128" fill="#dcd9d0" stroke="#141414" stroke-width="2.2" />
    <rect x="918" y="412" width="15" height="128" fill="#141414" opacity="0.78" />

    <!-- Seta Superior Esquerda (3D) -->
    <polygon points="632,74 664,70 662,25 718,18 724,52 818,126 756,152" fill="#141414" stroke="#141414" stroke-width="2" stroke-linejoin="round" />
    <polygon points="662,25 718,18 818,126 794,134 714,50 664,70" fill="url(#crosshatch-dark)" stroke="#141414" stroke-width="1.8" />
    <!-- Tubo de néon apagado na seta superior -->
    <polyline points="652,70 698,64 696,38 790,126" fill="none" stroke="#fbfaf8" stroke-width="2" opacity="0.85" />

    <!-- Corpo Principal do Letreiro -->
    <!-- Face lateral 3D esquerda (espessura da caixa metálica) -->
    <path d="M 662,176 L 714,176 L 714,332 L 662,330 Z" fill="url(#crosshatch-dark)" stroke="#141414" stroke-width="2.2" />
    <path d="M 738,136 C 738,118 758,108 780,108 L 780,176 L 738,176 Z" fill="url(#crosshatch-dark)" stroke="#141414" stroke-width="2" />

    <!-- Face frontal escura do letreiro -->
    <path d="M 714,176 L 764,176 C 764,112 812,102 930,110 C 1068,118 1110,145 1116,202 L 1176,205 L 1176,338 L 1060,350 L 775,350 L 770,332 L 714,332 Z" fill="#141414" stroke="#141414" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Ponta Inferior Direita da Seta (3D) -->
    <polygon points="1032,350 1138,342 1186,404 1118,410 1058,398 1084,392" fill="#141414" stroke="#141414" stroke-width="2" stroke-linejoin="round" />
    <polygon points="1032,350 1068,350 1122,402 1186,404 1118,410 1058,398" fill="url(#crosshatch-dark)" stroke="#141414" stroke-width="1.6" />
    <polyline points="1102,346 1168,396 1114,400" fill="none" stroke="#fbfaf8" stroke-width="2.2" opacity="0.9" />

    <!-- Tipografia do Letreiro -->
    <!-- "Mariposa" em caligrafia tubular de néon -->
    <text x="955" y="182" font-family="'Cormorant Garamond', Georgia, serif" font-size="76" font-style="italic" font-weight="600" fill="none" stroke="#fbfaf8" stroke-width="2.6" text-anchor="middle" transform="rotate(6, 955, 182)">Mariposa</text>

    <!-- "MOTEL" em letras garrafais com textura gasta pelo sol -->
    <text x="955" y="308" font-family="'Inter', Impact, sans-serif" font-size="126" font-weight="800" fill="#dcd9d0" stroke="#fbfaf8" stroke-width="2.2" letter-spacing="6" text-anchor="middle" transform="scale(0.88, 1.08) translate(120, -18)">MOTEL</text>
    <!-- Marcas de desgaste/ferrugem dentro das letras de MOTEL -->
    <path d="M 795 235 L 802 275 M 875 245 L 885 295 M 932 285 L 945 315 M 1025 240 L 1030 285 M 1095 265 L 1105 310" stroke="#141414" stroke-width="2.2" opacity="0.65" />

    <!-- Tabuleta Branca Inferior: CLEAN • QUIET • COMFORTABLE -->
    <!-- Caixa traseira em sombra -->
    <polygon points="788,350 845,350 845,420 788,416" fill="#dcd9d0" stroke="#141414" stroke-width="1.8" />
    <!-- Placa frontal branca -->
    <rect x="845" y="338" width="106" height="82" fill="#fbfaf8" stroke="#141414" stroke-width="2" />
    <text x="898" y="362" font-family="'Inter', sans-serif" font-size="17.5" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="0.8">CLEAN •</text>
    <text x="898" y="386" font-family="'Inter', sans-serif" font-size="17.5" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="0.8">• QUIET</text>
    <text x="898" y="408" font-family="'Inter', sans-serif" font-size="12.5" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="0.4">COMFORTABLE</text>
  </svg>
