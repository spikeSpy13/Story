<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Da partitura à película</title>
  <desc>Uma pauta musical se transforma em uma tira de filme. Uma tesoura e um compasso selecionam o recorte, enquanto notas e fotogramas descartados caem ao chão.</desc>
  <defs>
    <style>
      .bg { fill: #F9F8F6; }
      .ink-line { fill: none; stroke: #1A1A1A; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .ink-thick { fill: none; stroke: #1A1A1A; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .ink-solid { fill: #1A1A1A; }
      .warm-fill { fill: #E5E0D5; stroke: #1A1A1A; stroke-width: 2; stroke-linejoin: round; }
      .accent-line { fill: none; stroke: #A64B35; stroke-width: 2; stroke-dasharray: 6 6; stroke-linecap: round; }
      .accent-solid { fill: #A64B35; }
      .sprocket { fill: #F9F8F6; }
    </style>
  </defs>

  <!-- Fundo Off-White do Site -->
  <rect width="1200" height="675" class="bg" />

  <!-- ================= LADO ESQUERDO: PAUTA MUSICAL ================= -->
  <g id="musical-staff">
    <path d="M 60 290 C 200 240, 320 340, 460 290 C 520 268, 560 265, 600 265" class="ink-line" />
    <path d="M 60 315 C 200 265, 320 365, 460 315 C 520 293, 560 292, 600 292" class="ink-line" />
    <path d="M 60 340 C 200 290, 320 390, 460 340 C 520 318, 560 320, 600 320" class="ink-line" />
    <path d="M 60 365 C 200 315, 320 415, 460 365 C 520 343, 560 348, 600 348" class="ink-line" />
    <path d="M 60 390 C 200 340, 320 440, 460 390 C 520 368, 560 375, 600 375" class="ink-line" />

    <!-- Clave de Sol Estilizada -->
    <path d="M 105 405 C 95 405, 90 395, 98 388 C 110 380, 125 395, 112 410 C 95 425, 85 385, 105 335 C 120 295, 125 260, 112 255 C 102 255, 100 285, 108 320 L 112 425 C 112 438, 98 440, 95 432" class="ink-thick" />

    <!-- Barras de Compasso -->
    <line x1="250" y1="283" x2="250" y2="383" class="ink-line" />
    <line x1="430" y1="297" x2="430" y2="397" class="ink-line" />

    <!-- Notas Musicais -->
    <g>
      <ellipse cx="170" cy="350" rx="9" ry="6.5" transform="rotate(-20 170 350)" class="ink-solid" />
      <line x1="177" y1="347" x2="177" y2="300" class="ink-line" />
      
      <ellipse cx="215" cy="328" rx="9" ry="6.5" transform="rotate(-20 215 328)" class="ink-solid" />
      <line x1="222" y1="325" x2="222" y2="278" class="ink-line" />
      <path d="M 177 300 L 222 278 L 222 286 L 177 308 Z" class="ink-solid" />

      <ellipse cx="305" cy="370" rx="9" ry="6.5" transform="rotate(-20 305 370)" class="warm-fill" />
      <line x1="312" y1="367" x2="312" y2="318" class="ink-line" />

      <ellipse cx="370" cy="345" rx="9" ry="6.5" transform="rotate(-20 370 345)" class="ink-solid" />
      <line x1="377" y1="342" x2="377" y2="295" class="ink-line" />
      <path d="M 377 295 C 390 302, 395 312, 390 325" class="ink-line" />

      <ellipse cx="485" cy="332" rx="9" ry="6.5" transform="rotate(-20 485 332)" class="ink-solid" />
      <line x1="492" y1="329" x2="492" y2="282" class="ink-line" />
      <ellipse cx="535" cy="312" rx="9" ry="6.5" transform="rotate(-20 535 312)" class="ink-solid" />
      <line x1="542" y1="309" x2="542" y2="262" class="ink-line" />
      <path d="M 492 282 L 542 262 L 542 270 L 492 290 Z" class="ink-solid" />
    </g>
  </g>

  <!-- ================= LADO DIREITO: PELÍCULA DE FILME ================= -->
  <g id="film-strip">
    <!-- Corpo Sólido Preto da Película -->
    <path d="M 600 265 C 740 265, 820 345, 960 315 C 1040 298, 1100 270, 1140 275 L 1140 385 C 1100 380, 1040 408, 960 425 C 820 455, 740 375, 600 375 Z" class="ink-solid" />

    <!-- Quadros Internos (Preenchimento Bege Quente do Site) -->
    <!-- Quadro 1 (Em transição com linhas da pauta) -->
    <path d="M 612 287 C 645 288, 675 294, 705 302 L 705 362 C 675 354, 645 348, 612 347 Z" class="warm-fill" />
    <line x1="612" y1="305" x2="705" y2="320" class="ink-line" />
    <line x1="612" y1="325" x2="705" y2="340" class="ink-line" />
    <ellipse cx="655" cy="312" rx="7" ry="5" transform="rotate(-15 655 312)" class="ink-solid" />

    <!-- Quadro 2 -->
    <path d="M 722 306 C 758 316, 792 328, 828 336 L 828 396 C 792 388, 758 376, 722 366 Z" class="warm-fill" />
    <!-- Quadro 3 -->
    <path d="M 845 339 C 882 345, 918 345, 955 338 L 955 398 C 918 405, 882 405, 845 399 Z" class="warm-fill" />
    <!-- Quadro 4 -->
    <path d="M 972 335 C 1010 326, 1048 312, 1085 304 L 1085 364 C 1048 372, 1010 386, 972 395 Z" class="warm-fill" />

    <!-- Perfurações da Película (Sprockets) -->
    <g class="sprocket">
      <!-- Superior -->
      <rect x="620" y="272" width="10" height="8" rx="1.5" transform="rotate(4 620 272)" />
      <rect x="645" y="275" width="10" height="8" rx="1.5" transform="rotate(7 645 275)" />
      <rect x="670" y="280" width="10" height="8" rx="1.5" transform="rotate(10 670 280)" />
      <rect x="695" y="286" width="10" height="8" rx="1.5" transform="rotate(12 695 286)" />
      <rect x="725" y="294" width="10" height="8" rx="1.5" transform="rotate(14 725 294)" />
      <rect x="750" y="301" width="10" height="8" rx="1.5" transform="rotate(14 750 301)" />
      <rect x="775" y="309" width="10" height="8" rx="1.5" transform="rotate(13 775 309)" />
      <rect x="800" y="316" width="10" height="8" rx="1.5" transform="rotate(11 800 316)" />
      <rect x="825" y="322" width="10" height="8" rx="1.5" transform="rotate(9 825 322)" />
      <rect x="855" y="327" width="10" height="8" rx="1.5" transform="rotate(5 855 327)" />
      <rect x="880" y="330" width="10" height="8" rx="1.5" transform="rotate(2 880 330)" />
      <rect x="905" y="330" width="10" height="8" rx="1.5" transform="rotate(-2 905 330)" />
      <rect x="930" y="328" width="10" height="8" rx="1.5" transform="rotate(-6 930 328)" />
      <rect x="960" y="323" width="10" height="8" rx="1.5" transform="rotate(-10 960 323)" />
      <rect x="985" y="317" width="10" height="8" rx="1.5" transform="rotate(-13 985 317)" />
      <rect x="1010" y="309" width="10" height="8" rx="1.5" transform="rotate(-14 1010 309)" />
      <rect x="1035" y="301" width="10" height="8" rx="1.5" transform="rotate(-13 1035 301)" />
      <rect x="1060" y="294" width="10" height="8" rx="1.5" transform="rotate(-10 1060 294)" />
      <rect x="1085" y="288" width="10" height="8" rx="1.5" transform="rotate(-5 1085 288)" />
      <rect x="1110" y="285" width="10" height="8" rx="1.5" transform="rotate(0 1110 285)" />

      <!-- Inferior -->
      <rect x="620" y="355" width="10" height="8" rx="1.5" transform="rotate(4 620 355)" />
      <rect x="645" y="358" width="10" height="8" rx="1.5" transform="rotate(7 645 358)" />
      <rect x="670" y="363" width="10" height="8" rx="1.5" transform="rotate(10 670 363)" />
      <rect x="695" y="369" width="10" height="8" rx="1.5" transform="rotate(12 695 369)" />
      <rect x="725" y="377" width="10" height="8" rx="1.5" transform="rotate(14 725 377)" />
      <rect x="750" y="384" width="10" height="8" rx="1.5" transform="rotate(14 750 384)" />
      <rect x="775" y="392" width="10" height="8" rx="1.5" transform="rotate(13 775 392)" />
      <rect x="800" y="399" width="10" height="8" rx="1.5" transform="rotate(11 800 399)" />
      <rect x="825" y="405" width="10" height="8" rx="1.5" transform="rotate(9 825 405)" />
      <rect x="855" y="410" width="10" height="8" rx="1.5" transform="rotate(5 855 410)" />
      <rect x="880" y="413" width="10" height="8" rx="1.5" transform="rotate(2 880 413)" />
      <rect x="905" y="413" width="10" height="8" rx="1.5" transform="rotate(-2 905 413)" />
      <rect x="930" y="411" width="10" height="8" rx="1.5" transform="rotate(-6 930 411)" />
      <rect x="960" y="406" width="10" height="8" rx="1.5" transform="rotate(-10 960 406)" />
      <rect x="985" y="400" width="10" height="8" rx="1.5" transform="rotate(-13 985 400)" />
      <rect x="1010" y="392" width="10" height="8" rx="1.5" transform="rotate(-14 1010 392)" />
      <rect x="1035" y="384" width="10" height="8" rx="1.5" transform="rotate(-13 1035 384)" />
      <rect x="1060" y="377" width="10" height="8" rx="1.5" transform="rotate(-10 1060 377)" />
      <rect x="1085" y="371" width="10" height="8" rx="1.5" transform="rotate(-5 1085 371)" />
      <rect x="1110" y="368" width="10" height="8" rx="1.5" transform="rotate(0 1110 368)" />
    </g>
  </g>

  <!-- ================= CENTRO: TESOURA, COMPASSO E CORTE ================= -->
  <!-- Linha de Corte em Terracota (Cor de destaque da UI) -->
  <line x1="600" y1="210" x2="600" y2="440" class="accent-line" />

  <!-- Tesoura Editorial -->
  <g id="scissors" transform="translate(545, 115) rotate(12)">
    <!-- Lâmina 1 -->
    <path d="M 55 95 L 40 220 L 58 195 L 68 95 Z" class="warm-fill" />
    <!-- Lâmina 2 -->
    <path d="M 75 95 L 95 215 L 72 195 L 60 95 Z" class="ink-solid" />
    <!-- Parafuso Central Terracota -->
    <circle cx="64" cy="115" r="4" class="accent-solid" />
    <!-- Hastes e Anéis -->
    <path d="M 58 95 L 35 45" class="ink-thick" />
    <path d="M 70 95 L 95 45" class="ink-thick" />
    <ellipse cx="28" cy="30" rx="18" ry="24" transform="rotate(-15 28 30)" class="ink-thick" />
    <ellipse cx="102" cy="30" rx="18" ry="24" transform="rotate(15 102 30)" class="ink-thick" />
  </g>

  <!-- Compasso de Precisão (Medindo o Recorte) -->
  <g id="compass" transform="translate(715, 110) rotate(-8)">
    <!-- Topo e Cabeça -->
    <rect x="56" y="0" width="8" height="18" class="ink-solid" />
    <circle cx="60" cy="26" r="12" class="warm-fill" />
    <circle cx="60" cy="26" r="4" class="ink-solid" />
    <!-- Pernas do Compasso -->
    <path d="M 53 35 L 5 210 L 14 210 L 60 38 Z" class="warm-fill" />
    <path d="M 67 35 L 115 215 L 106 215 L 60 38 Z" class="ink-solid" />
    <!-- Roda e Eixo de Ajuste -->
    <line x1="15" y1="115" x2="105" y2="115" class="ink-line" />
    <rect x="55" y="106" width="10" height="18" rx="2" class="accent-solid" />
    <!-- Arco de Medição Tracejado -->
    <path d="M 5 210 Q 60 240 115 215" class="accent-line" />
  </g>

  <!-- ================= BASE: FRAGMENTOS DESCARTADOS NO CHÃO ================= -->
  <g id="floor-debris">
    <!-- Linhas de Chão Minimalistas -->
    <line x1="250" y1="595" x2="950" y2="595" class="ink-line" />
    <line x1="380" y1="612" x2="820" y2="612" class="ink-line" />

    <!-- Fragmentos Caindo -->
    <g transform="translate(560, 455) rotate(-25)">
      <ellipse cx="10" cy="10" rx="8" ry="5.5" class="ink-solid" />
      <line x1="17" y1="8" x2="17" y2="-25" class="ink-line" />
    </g>
    <g transform="translate(635, 480) rotate(35)">
      <rect x="0" y="0" width="38" height="28" class="warm-fill" />
      <line x1="0" y1="9" x2="38" y2="9" class="ink-line" />
      <line x1="0" y1="19" x2="38" y2="19" class="ink-line" />
    </g>

    <!-- Pedaço de Partitura no Chão -->
    <g transform="translate(430, 560) rotate(-8)">
      <polygon points="0,15 110,0 125,30 15,42" class="warm-fill" />
      <line x1="8" y1="22" x2="115" y2="10" class="ink-line" />
      <line x1="12" y1="32" x2="120" y2="20" class="ink-line" />
      <ellipse cx="55" cy="20" rx="7" ry="5" transform="rotate(-15 55 20)" class="ink-solid" />
      <ellipse cx="85" cy="15" rx="7" ry="5" transform="rotate(-15 85 15)" class="ink-solid" />
    </g>

    <!-- Fotograma de Filme Cortado no Chão -->
    <g transform="translate(650, 550) rotate(6)">
      <polygon points="0,10 130,0 145,42 15,52" class="ink-solid" />
      <polygon points="22,15 115,8 125,35 32,42" class="warm-fill" />
      <rect x="8" y="13" width="7" height="5" class="sprocket" />
      <rect x="10" y="25" width="7" height="5" class="sprocket" />
      <rect x="12" y="37" width="7" height="5" class="sprocket" />
      <rect x="122" y="5" width="7" height="5" class="sprocket" />
      <rect x="126" y="17" width="7" height="5" class="sprocket" />
      <rect x="130" y="29" width="7" height="5" class="sprocket" />
    </g>

    <!-- Nota Solta no Chão -->
    <g transform="translate(580, 582) rotate(65)">
      <ellipse cx="0" cy="0" rx="8" ry="5.5" class="accent-solid" />
      <line x1="7" y1="-2" x2="7" y2="-32" class="ink-line" />
    </g>
  </g>
</svg>
